########################### About ##################################
about:
  enable: true
  image: 'images/Ale.png'
  title: 'About Me'
  content: Hi! I'm Alessandro Guidi, a Product Manager working at the intersection of AI, data, and finance. At Amazon I build B2B products for the EU5 market, and on the side I run ML research on venture-capital valuation — with two papers currently under review at ICIS 2026 and WI 2026.
    <br>
    My favourite quest is turning model outputs into product decisions — bridging data-science teams and business stakeholders across fintech, wealthtech, and financial services.
    <br>
    If you want to team up or just say hi, reach me on [LinkedIn](https://www.linkedin.com/in/alessandroguidi1/), [GitHub](https://github.com/alexguidioff), or by [email](mailto:alexguidioff@gmail.com).
  button:
    enable: true
    label: 'DOWNLOAD MY RESUME'
    link: 'CV/Alessandro_Guidi_Resume.pdf'
    icon: 'fa-download'

###########################3 Experience ##############################
experience:
  enable: true
  title: 'EXPERIENCE'
  experience_list:
    - name: EU5 3P Product Manager
      company: '[Amazon](https://www.amazon.com/) · Paris'
      duration: 'Sep 2025 - present'
      content: "Leading the EU5 quest to onboard strategic B2B sellers (+€100M annual revenue) onto Amazon Business, rallying a party of Sales, Tech, Legal, and Ops across 5 markets. Redesigned the Salesforce CRM with data-driven automation, cutting operational overhead ~25% and shortening the commercial cycle end-to-end. Every funnel KPI is a stat I'm here to level up."

    - name: Consultant
      company: '[Capgemini](https://www.capgemini.com/) · Milan'
      duration: 'Sep 2023 - Aug 2025'
      content: "Crafted financial models and reengineered processes for Tier-1 banking guilds, unlocking ~€2M in documented cost savings. Built market-analysis models and risk-assessment tools to guide executives through digital-transformation campaigns, presenting insights to C-level stakeholders at regulated institutions."

    - name: ML Researcher · Master's Thesis
      company: '[ESCP Business School](https://escp.eu/) · Paris / Turin'
      duration: '2025 - 2026'
      content: "Built an end-to-end ML pipeline predicting startup valuations from investor co-investment networks across 10,000+ VC-backed companies. Engineered graph features (centrality, syndicate overlap) and benchmarked XGBoost / Random Forest with SHAP against DCF and comparables, beating the baselines on early-stage valuation. Two papers under review at ICIS 2026 & WI 2026."

    - name: President · 180 Degrees Consulting
      company: '[180 Degrees Consulting](https://180dc.org/) · Turin'
      duration: '2022 - 2025'
      content: "Climbed the full party roster — Consultant → Project Manager → Consulting Director → President — setting chapter strategy, managing the project portfolio, and coaching PMs. Led CiboCrudo's B2B EU5 expansion through reseller partnerships, driving ~30% revenue growth."

