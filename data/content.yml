########################### About ##################################
about:
  enable: true
  image: 'images/Ale.png'
  title: 'About Me'
  content: I connect product strategy with technical depth in ML, LLMs, and blockchain/DeFi. My experience spans Amazon, Capgemini, and applied research on venture-capital valuation. I translate model outputs into product decisions, bridging data-science teams and business stakeholders across fintech, wealthtech, and financial services.
    <br>
    If you want to team up or just say hi, reach me on [LinkedIn](https://www.linkedin.com/in/alessandroguidi1/), [GitHub](https://github.com/alexguidioff), or by [email](mailto:alexguidioff@gmail.com).
  button:
    enable: true
    label: 'DOWNLOAD MY RESUME'
    link: 'CV/Alessandro_Guidi_CV_2026.pdf'
    icon: 'fa-download'

research:
  title: 'RESEARCH & PUBLICATIONS'
  paper_title: 'A Data-Driven Decision Support System for Venture Capital Valuation'
  affiliation: 'ESCP Business School · Paris / Turin · 2025–2026'
  status: 'Accepted at WI 2026 · Business Informatics · Student Track'
  summary: 'Co-authored a conference paper based on my master’s thesis: an end-to-end ML pipeline for private-company valuation, combining investor co-investment networks, funding history, and market signals.'
  finding: 'Investor-syndicate capacity (mean co-investor AUM) was the dominant valuation driver in the SHAP analysis, providing evidence of information saturation.'
  methods: 'Engineered network features including centrality, clustering, and syndicate overlap. Benchmarked Random Forest and XGBoost against DCF/comparables, using SHAP for explainability and an out-of-time holdout spanning the 2022 correction. The best model performed competitively with, and more robustly than, the traditional baselines.'
  metrics:
    - value: '3,403'
      label: 'PitchBook-backed deals'
    - value: '0.557'
      label: 'Random Forest R²'
    - value: '0.888'
      label: 'Mean absolute error'

