    - name: Research & Publications · Master's Thesis
      company: '[ESCP Business School](https://escp.eu/) · Paris / Turin'
      duration: '2025 - 2026'
      content: "Developed an ML decision support system for venture-capital valuation and co-authored a paper accepted at WI 2026. [Read the research summary](#research)."

    - name: President · 180 Degrees Consulting
      company: '[180 Degrees Consulting](https://180dc.org/) · Turin'
      duration: 'Sep 2022 - Jul 2025'
      content: "Progressed from Consultant to Project Manager, Consulting Director, and President. Defined chapter strategy, managed the project portfolio, and coached project managers. Led CiboCrudo's B2B EU5 expansion through reseller partnerships, driving ~30% revenue growth."

