############################# Education ################################
education:
  enable: true
  title: 'EDUCATION'
  education_list:
    - name: Master in Management — GPA 3.8/4.0
      school: '[ESCP Business School](https://escp.eu/) · Turin · Berlin · Madrid · Paris'
      duration: 'Sep 2022 - Sep 2026'
      content: "A multi-campus journey across Turin, Berlin, Madrid, and Paris, split between two tracks — Finance (English track) and International Business Consulting. On the finance side I went deep into Firm Valuation, Advanced Corporate Finance, Options/Futures & other Derivatives, Empirical Methods in Finance, and Behavioural Finance; on the consulting side I worked through Foundations of Consulting, Economic Consulting, and back-to-back Live Case Studies on digital transformation and sustainability. I graduated with a 3.8/4.0 GPA, and the final boss was my thesis — an ML-based decision support system for venture-capital valuation, now under review at ICIS 2026 and WI 2026."

    - name: The Future of Financial Institutions Management
      school: '[SDA Bocconi](https://www.sdabocconi.it/) & Capgemini · Milan'
      duration: 'Sep 2023'
      content: "A corporate-sponsored deep-dive into the future of banking: financial markets, digital innovation, and the strategic shifts reshaping financial institutions. An intense side-quest that connected classroom theory to the real transformation challenges I'd soon tackle as a consultant."

    - name: Bachelor's in Business & Management — 110/110
      school: '[Università degli Studi di Torino](https://www.unito.it/) · Turin'
      duration: 'Sep 2019 - Sep 2022'
      content: "Graduated with top marks (110/110), building the foundations in accounting, economics, corporate finance, and management that everything else stands on. This is where I first fell for the mix of numbers, strategy, and problem-solving that still drives my work today."

